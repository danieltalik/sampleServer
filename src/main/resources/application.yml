spring:
  application:
    name: sampleServer
  datasource:
    url: jdbc:h2:mem:pets
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  h2:
    console:
      # Off by default. Run with --spring.profiles.active=dev to turn it on locally.
      enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8085

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
